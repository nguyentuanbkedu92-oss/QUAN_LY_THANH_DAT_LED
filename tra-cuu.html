<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Kiến Thức & Hướng Dẫn - Thành Đạt LED</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 14px; }
        .wrap { max-width: 860px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 16px; }
        header h1 { font-size: 20px; color: #38bdf8; text-transform: uppercase; }
        header a { color: #94a3b8; font-size: 12px; text-decoration: none; }

        .banner { display: none; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
        .banner.ok { background: #052e1c; color: #4ade80; border: 1px solid #14532d; }
        .banner.err { background: #3a0d0d; color: #fca5a5; border: 1px solid #7f1d1d; }

        section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 18px; }
        section h2 { font-size: 14px; color: #e87722; text-transform: uppercase; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

        .search-box { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px 14px; color: #f8fafc; font-size: 14px; margin-bottom: 12px; outline: none; }
        .search-box:focus { border-color: #38bdf8; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .chip { background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; padding: 6px 12px; border-radius: 20px; cursor: pointer; user-select: none; }
        .chip.active { background: #0c4a6e; border-color: #38bdf8; color: #7dd3fc; }
        .chip .count { opacity: .7; margin-left: 4px; }

        .result-meta { font-size: 11px; color: #64748b; margin-bottom: 10px; }

        .faq-item { background: #0f172a; border: 1px solid #334155; border-left: 3px solid #38bdf8; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .faq-q { font-weight: bold; font-size: 14px; color: #38bdf8; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .faq-tag { font-size: 10px; background: #0c4a6e; color: #7dd3fc; padding: 2px 8px; border-radius: 20px; white-space: nowrap; height: fit-content; }
        .faq-a { font-size: 13px; color: #cbd5e1; line-height: 1.5; white-space: pre-wrap; margin-bottom: 8px; }
        mark { background: #e87722; color: #0f172a; border-radius: 3px; padding: 0 2px; }

        .faq-actions { display: flex; justify-content: flex-end; }
        .btn-copy { background: #1e293b; border: 1px solid #334155; color: #7dd3fc; font-size: 11px; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-copy:hover { border-color: #38bdf8; }
        .btn-copy.copied { color: #4ade80; border-color: #14532d; }

        .missing-box { background: #0f172a; border: 1px dashed #e87722; border-radius: 8px; padding: 14px; margin-top: 15px; text-align: center; }
        .missing-box p { font-size: 12px; color: #fdba74; margin-bottom: 8px; }
        .missing-input, .missing-select { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 10px; color: #fff; font-size: 12px; margin-bottom: 8px; outline: none; }
        .missing-input:focus, .missing-select:focus { border-color: #e87722; }
        .btn-submit { background: #e87722; color: #fff; border: none; padding: 9px 18px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .btn-submit:disabled { opacity: .5; cursor: default; }
        .btn-submit:active:not(:disabled) { background: #c25e10; }
        .empty { color: #64748b; font-size: 13px; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Tra Cứu Thông Tin & Hỏi Đáp - TDL</h1>
        <a href="index.html">&larr; Về trang chính</a>
    </header>

    <div id="banner" class="banner"></div>

    <section>
        <h2>Tìm kiếm nhanh thông số, câu hỏi, chính sách</h2>
        <input type="text" id="search-input" class="search-box" placeholder="🔍 Nhập từ khóa (vd: đèn pha 200W, bảo hành, thanh toán...)">

        <div id="chip-bar" class="chips"></div>
        <div id="result-meta" class="result-meta"></div>

        <div id="faq-list"><div class="empty">Đang tải dữ liệu từ hệ thống...</div></div>

        <div id="missing-section" class="missing-box" style="display:none;">
            <p>🤔 Không tìm thấy thông tin bạn cần? Hãy gửi câu hỏi để quản lý cập nhật.</p>
            <select id="new-category" class="missing-select">
                <option value="">-- Chọn danh mục liên quan (không bắt buộc) --</option>
            </select>
            <input type="text" id="new-question" class="missing-input" placeholder="Nhập câu hỏi hoặc yêu cầu cần tra cứu...">
            <button class="btn-submit" id="btn-submit" onclick="submitMissingQuestion()">📤 Gửi câu hỏi mới</button>
        </div>
    </section>
</div>

<script>
// ============ CẤU HÌNH ============
// URL Web App độc lập của bạn
const FAQ_API_URL = 'https://script.google.com/macros/s/AKfycbwSQjnbLutLN4RMU7Cp3IZLWlyiOVBIZANRcSDq-wfEoEnhJW4eV1QZkDTTnkp0JnjPpQ/exec';

// (Tuỳ chọn) Đổi tên hiển thị đẹp hơn cho tên tab kỹ thuật. Không khai báo = giữ nguyên tên tab.
const DANH_MUC_LABELS = {
    'Faq': 'Câu hỏi chung',
    'DenPha': 'Đèn pha LED',
    'DenDuong': 'Đèn đường LED',
    'ChinhSach': 'Chính sách'
};

// ============ STATE ============
let faqData = [];
let activeCategory = '';
let searchDebounce = null;

function labelOf(danhMuc) {
    return DANH_MUC_LABELS[danhMuc] || danhMuc;
}

function showBanner(type, msg) {
    const b = document.getElementById('banner');
    b.innerHTML = msg; b.className = 'banner ' + type; b.style.display = 'block';
    if (type === 'ok') setTimeout(() => b.style.display = 'none', 3000);
}

function loadFaq() {
    const el = document.getElementById('faq-list');
    fetch(FAQ_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getFaq' })
    })
    .then(response => response.json())
    .then(res => {
        if (res.status === 'ok') {
            faqData = res.faq || [];
            buildChipBar();
            renderFaq();
        } else {
            throw new Error(res.msg || 'Lỗi dữ liệu từ server');
        }
    })
    .catch(e => {
        el.innerHTML = '<div class="empty">Không tải được dữ liệu tra cứu. Vui lòng kiểm tra lại kết nối.<br>(' + escapeHtml(e.message) + ')</div>';
    });
}

function buildChipBar() {
    const counts = {};
    faqData.forEach(item => { counts[item.danhMuc] = (counts[item.danhMuc] || 0) + 1; });
    const categories = Object.keys(counts).sort();

    const bar = document.getElementById('chip-bar');
    let html = `<div class="chip ${activeCategory === '' ? 'active' : ''}" onclick="setCategory('')">Tất cả <span class="count">${faqData.length}</span></div>`;
    categories.forEach(cat => {
        html += `<div class="chip ${activeCategory === cat ? 'active' : ''}" onclick="setCategory('${escapeHtml(cat).replace(/'/g, "\\'")}')">${escapeHtml(labelOf(cat))} <span class="count">${counts[cat]}</span></div>`;
    });
    bar.innerHTML = html;

    // đồng bộ danh sách danh mục cho khung gửi câu hỏi mới
    const sel = document.getElementById('new-category');
    sel.innerHTML = '<option value="">-- Chọn danh mục liên quan (không bắt buộc) --</option>' +
        categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(labelOf(cat))}</option>`).join('');
}

function setCategory(cat) {
    activeCategory = cat;
    buildChipBar();
    renderFaq();
}

function getFilteredList() {
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    return faqData.filter(item => {
        if (activeCategory && item.danhMuc !== activeCategory) return false;
        if (!query) return true;
        const haystack = [item.cauHoi, item.traLoi, item.danhMuc, item.tuKhoa].join(' ').toLowerCase();
        return haystack.includes(query);
    });
}

function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const escQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.replace(new RegExp('(' + escQuery + ')', 'ig'), '<mark>$1</mark>');
}

function renderFaq() {
    const el = document.getElementById('faq-list');
    const missingSec = document.getElementById('missing-section');
    const meta = document.getElementById('result-meta');
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    missingSec.style.display = 'block';

    if (!faqData.length) {
        el.innerHTML = '<div class="empty">Chưa có dữ liệu trong kho kiến thức.</div>';
        meta.textContent = '';
        return;
    }

    const list = getFilteredList();
    meta.textContent = `Đang hiển thị ${list.length}/${faqData.length} mục`;

    if (!list.length) {
        el.innerHTML = '<div class="empty">Không tìm thấy kết quả phù hợp. Hãy gửi câu hỏi bên dưới.</div>';
        return;
    }

    el.innerHTML = list.map(item => `
        <div class="faq-item">
            <div class="faq-q">
                <span>💡 ${highlight(item.cauHoi, query)}</span>
                <span class="faq-tag">${escapeHtml(labelOf(item.danhMuc))}</span>
            </div>
            <div class="faq-a">${highlight(item.traLoi, query)}</div>
            <div class="faq-actions">
                <button class="btn-copy" onclick="copyItem(this, ${JSON.stringify(item.cauHoi)}, ${JSON.stringify(item.traLoi)})">📋 Copy tư vấn</button>
            </div>
        </div>
    `).join('');
}

function copyItem(btn, cauHoi, traLoi) {
    const text = `❓ ${cauHoi}\n\n💬 ${traLoi}`;
    const done = () => {
        const old = btn.textContent;
        btn.textContent = '✅ Đã copy';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1800);
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
        fallbackCopy(text, done);
    }
}

function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { showBanner('err', '❌ Không copy được, hãy copy thủ công.'); }
    document.body.removeChild(ta);
}

document.getElementById('search-input').addEventListener('input', function () {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(renderFaq, 250);
});

async function submitMissingQuestion() {
    const input = document.getElementById('new-question');
    const sel = document.getElementById('new-category');
    const cauHoi = input.value.trim();
    const danhMuc = sel.value;
    const btn = document.getElementById('btn-submit');
    if (!cauHoi) {
        showBanner('err', '❌ Vui lòng nhập nội dung câu hỏi!');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Đang gửi...';
    try {
        const response = await fetch(FAQ_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'saveMissingQuestion', cauHoi: cauHoi, danhMuc: danhMuc })
        });
        const res = await response.json();
        if (res.status !== 'ok') throw new Error(res.msg);

        showBanner('ok', '✅ Đã gửi câu hỏi thành công! Quản lý sẽ cập nhật câu trả lời sớm.');
        input.value = '';
        sel.value = '';
    } catch (e) {
        showBanner('err', '❌ Lỗi gửi câu hỏi: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '📤 Gửi câu hỏi mới';
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadFaq();
</script>
</body>
</html>
