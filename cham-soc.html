<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chăm Sóc Khách Hàng - Thành Đạt LED</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:#0f172a; color:#f8fafc; padding:14px; }
  header { text-align:center; margin-bottom:16px; }
  header h1 { font-size:20px; color:#38bdf8; text-transform:uppercase; }
  header a { color:#94a3b8; font-size:12px; text-decoration:none; }

  .wrap { max-width:860px; margin:0 auto; }

  .banner { display:none; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; }
  .banner.ok { background:#052e1c; color:#4ade80; border:1px solid #14532d; }
  .banner.err { background:#3a0d0d; color:#fca5a5; border:1px solid #7f1d1d; }
  .banner.warn { background:#3a2a0d; color:#fcd34d; border:1px solid #78350f; }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px; }
  .stat-card { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:10px 6px; text-align:center; }
  .stat-card .num { font-size:20px; font-weight:bold; color:#38bdf8; }
  .stat-card .lbl { font-size:10px; color:#94a3b8; text-transform:uppercase; margin-top:2px; }

  section { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; margin-bottom:18px; }
  section h2 { font-size:14px; color:#e87722; text-transform:uppercase; margin-bottom:12px; border-bottom:1px solid #334155; padding-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
  .refresh-btn { background:none; border:1px solid #334155; color:#94a3b8; border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; text-transform:none; }
  .refresh-btn:active { background:#334155; }

  .search-box { width:100%; background:#0f172a; border:1px solid #334155; border-radius:8px; padding:10px 14px; color:#f8fafc; font-size:13px; margin-bottom:12px; outline:none; }
  .search-box:focus { border-color:#38bdf8; }

  .task { background:#0f172a; border:1px solid #334155; border-left:3px solid #e87722; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .task.done { opacity:0.4; border-left-color:#22c55e; }
  .task-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .task-name { font-weight:bold; font-size:14px; }
  .task-tag { font-size:10px; background:#7c2d12; color:#fdba74; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .task-tag.buy { background:#0c4a6e; color:#7dd3fc; }
  .task-note { font-size:12px; color:#94a3b8; margin-top:4px; }
  .task-product-info { font-size:11.5px; color:#38bdf8; margin-top:6px; font-weight:500; }
  .task-staff-info { font-size:10.5px; color:#94a3b8; margin-top:2px; }
  .task-actions { display:flex; gap:6px; margin-top:8px; }
  .btn-sm { flex:1; padding:7px; border:none; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; text-align:center; text-decoration:none; }
  .btn-call { background:#334155; color:#fff; }
  .btn-done { background:#22c55e; color:#052e1c; }
  .empty { color:#64748b; font-size:13px; text-align:center; padding:20px 0; }

  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tab-btn { background:#0f172a; border:1px solid #334155; color:#94a3b8; padding:6px 12px; border-radius:20px; font-size:11px; cursor:pointer; }
  .tab-btn.active { background:#38bdf8; color:#0f172a; border-color:#38bdf8; font-weight:bold; }

  .kh-row { display:flex; justify-content:space-between; align-items:center; padding:12px 6px; border-bottom:1px solid #263449; gap:10px; }
  .kh-row:last-child { border-bottom:none; }
  .kh-info { min-width:0; flex:1; }
  .kh-name { font-weight:bold; font-size:13px; color:#f8fafc; }
  .kh-sub { font-size:11px; color:#94a3b8; margin-top:1px; }

  .kh-product-info { font-size:11.5px; color:#38bdf8; margin-top:4px; font-weight:500; }
  .kh-staff-info { font-size:10.5px; color:#94a3b8; margin-top:2px; }

  .kh-badge { font-size:10px; padding:2px 8px; border-radius:20px; white-space:nowrap; display:inline-block; margin-top:4px; }
  .b-tiemnang { background:#334155; color:#cbd5e1; }
  .b-damua { background:#0c4a6e; color:#7dd3fc; }
  .b-mualai { background:#064e3b; color:#6ee7b7; }
  .b-lauchua { background:#7c2d12; color:#fdba74; }
  .b-vip { background:#4c1d95; color:#d8b4fe; }

  .kh-money { text-align:right; font-size:12px; color:#f8fafc; white-space:nowrap; }
  .kh-money .lbl { color:#64748b; font-size:10px; }

  .cfg { font-size:11px; color:#64748b; margin-top:20px; text-align:center; }
  .cfg .cfg-row { margin-top:10px; }
  .cfg input { width:80%; max-width:400px; background:#0f172a; border:1px solid #334155; color:#cbd5e1; padding:6px; border-radius:6px; font-size:11px; margin-top:6px; }
  .cfg button { margin-left:6px; background:#38bdf8; color:#0f172a; border:none; padding:6px 10px; border-radius:6px; font-size:11px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chăm sóc khách hàng - TDL</h1>
    <a href="index.html">&larr; Về trang chính</a>
  </header>

  <div id="banner" class="banner"></div>

  <div class="stats">
    <div class="stat-card"><div class="num" id="s-tasks">-</div><div class="lbl">Cần làm hôm nay</div></div>
    <div class="stat-card"><div class="num" id="s-total">-</div><div class="lbl">Tổng khách</div></div>
    <div class="stat-card"><div class="num" id="s-mualai">-</div><div class="lbl">Mua lại</div></div>
    <div class="stat-card"><div class="num" id="s-vip">-</div><div class="lbl">VIP / NPP</div></div>
  </div>

  <section>
    <h2>Việc cần làm hôm nay <button class="refresh-btn" onclick="loadAll()">🔄 Tải lại</button></h2>
    <div id="task-list"><div class="empty">Đang tải...</div></div>
  </section>

  <section>
    <h2>Danh sách khách hàng</h2>
    <input type="text" id="search-input" class="search-box" placeholder="🔍 Tìm kiếm theo Tên, Số điện thoại hoặc Sản phẩm..." oninput="renderKhach()">
    <div class="tabs" id="tabs"></div>
    <div id="kh-list"><div class="empty">Đang tải...</div></div>
  </section>

  <div class="cfg">
    <div class="cfg-row">
      URL API CRM
      <div><input id="api-url-input" placeholder="https://script.google.com/macros/s/.../exec"><button onclick="saveUrl()">Lưu</button></div>
    </div>
    <div class="cfg-row">
      URL API Báo Giá <span style="color:#475569">(để tự lấy sản phẩm/SL/giá đã báo theo SĐT)</span>
      <div><input id="baogia-url-input" placeholder="https://script.google.com/macros/s/.../exec"><button onclick="saveBaoGiaUrl()">Lưu</button></div>
    </div>
  </div>
</div>

<script>
let apiUrl = localStorage.getItem('tdlcrm_api_url') || 'https://script.google.com/macros/s/AKfycbx11aX_eBt4qI7Ip9LyUye6G6UP_IkaoFghkAoALX6kNrHNileXqdxXNjm-J13pHTyY/exec';
let baoGiaApiUrl = localStorage.getItem('tdlcrm_baogia_api_url') || '';
let khachHang = [];
let tasks = [];
let quotesByPhone = {}; // phoneKey -> báo giá gần nhất (đã có products[], tongTien, timestamp...)
let currentFilter = 'all';

const FILTERS = [
  { key:'all', label:'Tất cả' },
  { key:'Khách tiềm năng', label:'Tiềm năng' },
  { key:'Đã mua', label:'Đã mua' },
  { key:'Khách mua lại', label:'Mua lại' },
  { key:'Lâu chưa mua', label:'Lâu chưa mua' },
  { key:'VIP / NPP', label:'VIP / NPP' }
];
const BADGE_CLASS = {
  'Khách tiềm năng':'b-tiemnang', 'Đã mua':'b-damua', 'Khách mua lại':'b-mualai',
  'Lâu chưa mua':'b-lauchua', 'VIP / NPP':'b-vip'
};

document.getElementById('api-url-input').value = apiUrl;
document.getElementById('baogia-url-input').value = baoGiaApiUrl;

async function apiCall(action, data) {
  const resp = await fetch(apiUrl, { method:'POST', body: JSON.stringify({ action, data: data||{} }) });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}

// Gọi API Báo Giá (GET ?action=list&sheet=BaoGia) - không throw, lỗi thì trả mảng rỗng
// để không làm hỏng phần CRM chính nếu URL sai hoặc chưa cấu hình.
async function fetchBaoGia() {
  if (!baoGiaApiUrl) return [];
  try {
    const sep = baoGiaApiUrl.includes('?') ? '&' : '?';
    const resp = await fetch(baoGiaApiUrl + sep + 'action=list&sheet=BaoGia');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (!data.success) throw new Error(data.error || 'Lỗi không rõ');
    return data.rows || [];
  } catch (e) {
    console.error('Lỗi tải Báo Giá:', e);
    return [];
  }
}

function showBanner(type, msg) {
  const b = document.getElementById('banner');
  b.textContent = msg; b.className = 'banner ' + type; b.style.display = 'block';
}
function hideBanner() { document.getElementById('banner').style.display = 'none'; }

// Hàm tự động chuẩn hóa số điện thoại (bổ sung số 0 nếu bị mất số đầu) - dùng để HIỂN THỊ
function fmtPhone(s) {
  let cleanS = String(s || '').trim();
  if (cleanS.length === 9 && !cleanS.startsWith('0')) {
    cleanS = '0' + cleanS;
  }
  return cleanS;
}

// Chuẩn hóa số điện thoại để SO KHỚP giữa các nguồn dữ liệu khác nhau (CRM vs Báo Giá).
// SĐT trong sheet Báo Giá có thể dính tên ("0981485716 - Mr. Nam"), có khoảng trắng
// ("0944 188 198"), hoặc bị Google Sheets làm mất số 0 đầu khi đọc là number (985950120).
function phoneKey(s) {
  let d = String(s == null ? '' : s).replace(/\D/g, '');
  if (!d) return '';
  if (d.length === 9 && !d.startsWith('0')) d = '0' + d;
  if (d.length === 11 && d.startsWith('84')) d = '0' + d.slice(2);
  return d;
}

function fmtCur(n) {
  n = n || 0;
  if (Math.abs(n) >= 1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'') + ' tỷ';
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'') + ' tr';
  return Math.round(n).toLocaleString('vi-VN') + ' đ';
}

function fmtDate(s) {
  if (!s) return '-';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}

// Với mỗi SĐT, gộp toàn bộ báo giá về SĐT đó và chỉ giữ lại bản GẦN NHẤT (theo timestamp).
function buildQuotesIndex(rows) {
  const idx = {};
  (rows || []).forEach(r => {
    const key = phoneKey(r.sdt);
    if (!key) return;
    const ts = Date.parse(r.timestamp) || 0;
    if (!idx[key] || ts > idx[key]._ts) {
      idx[key] = Object.assign({}, r, { _ts: ts });
    }
  });
  return idx;
}

async function loadAll() {
  document.getElementById('task-list').innerHTML = '<div class="empty">Đang tải...</div>';
  document.getElementById('kh-list').innerHTML = '<div class="empty">Đang tải...</div>';
  try {
    const [r1, r2, bgRows] = await Promise.all([
      apiCall('getChamSoc', { chuaXuLy:true }),
      apiCall('getKhachHang'),
      fetchBaoGia()
    ]);
    if (r1.status !== 'ok') throw new Error(r1.msg);
    if (r2.status !== 'ok') throw new Error(r2.msg);
    tasks = r1.chamSoc || [];
    khachHang = r2.khachHang || [];
    quotesByPhone = buildQuotesIndex(bgRows);
    hideBanner();
    if (baoGiaApiUrl && !bgRows.length) {
      showBanner('warn', '⚠️ Không lấy được dữ liệu từ URL API Báo Giá (kiểm tra lại URL bên dưới)');
    }
    renderStats();
    renderTasks();
    renderTabs();
    renderKhach();
  } catch (e) {
    showBanner('err', '❌ Không kết nối được API: ' + e.message);
    document.getElementById('task-list').innerHTML = '<div class="empty">Không tải được dữ liệu</div>';
    document.getElementById('kh-list').innerHTML = '';
  }
}

function renderStats() {
  document.getElementById('s-tasks').textContent = tasks.length;
  document.getElementById('s-total').textContent = khachHang.length;
  document.getElementById('s-mualai').textContent = khachHang.filter(k => k.phanLoai === 'Khách mua lại').length;
  document.getElementById('s-vip').textContent = khachHang.filter(k => k.phanLoai === 'VIP / NPP').length;
}

// Tìm khách hàng tương ứng trong danh sách CRM theo SĐT (để lấy SP đã báo giá & nhân viên phụ trách)
function findKhachByPhone(sdt) {
  const p = phoneKey(sdt);
  return khachHang.find(k => phoneKey(k.sdt) === p);
}

// Dòng thông tin sản phẩm: ưu tiên dữ liệu đã nhập tay trong CRM (kh.nhuCauChinh),
// nếu chưa có thì tự lấy từ báo giá GẦN NHẤT khớp SĐT trong sheet BaoGia.
function productInfoLine(sdt, kh) {
  if (kh && kh.nhuCauChinh) {
    return `📦 ${kh.nhuCauChinh}${kh.soLuong ? ' — SL: <b>' + kh.soLuong + '</b>' : ''}${kh.donGia ? ' — Giá: <b>' + fmtCur(kh.donGia) + '</b>' : ''}`;
  }
  const q = quotesByPhone[phoneKey(sdt)];
  if (q && Array.isArray(q.products) && q.products.length) {
    const p0 = q.products[0];
    let desc = String(p0.mo_ta || '').split('\n')[0].trim();
    if (desc.length > 70) desc = desc.slice(0, 70) + '…';
    const more = q.products.length > 1 ? ` (+${q.products.length - 1} SP khác)` : '';
    const sl = p0.so_luong;
    const gia = p0.don_gia;
    return `📦 ${desc || 'Sản phẩm'}${more}${sl ? ' — SL: <b>' + sl + '</b>' : ''}${gia ? ' — Giá: <b>' + fmtCur(Number(gia)) + '</b>' : ''}` +
      ` <span style="color:#64748b;font-size:10px;">(BG ${fmtDate(q.timestamp)})</span>`;
  }
  return '📦 <span style="color:#f59e0b">Chưa tìm thấy báo giá nào khớp SĐT</span>';
}

function renderTasks() {
  const el = document.getElementById('task-list');
  if (!tasks.length) { el.innerHTML = '<div class="empty">✅ Không có việc nào cần làm hôm nay</div>'; return; }
  el.innerHTML = tasks.map(t => {
    const kh = findKhachByPhone(t.sdt);
    const productLine = productInfoLine(t.sdt, kh);
    const staffLine = `👤 Nhân viên đã báo giá: <b>${(kh && kh.nhanVien) || 'Chưa rõ'}</b>`;
    return `
    <div class="task" id="task-${t.id}">
      <div class="task-top">
        <div>
          <div class="task-name">${t.ten || fmtPhone(t.sdt)}</div>
          <div class="task-note">📞 ${fmtPhone(t.sdt)} — ${t.ghiChu || ''}</div>
          <div class="task-product-info">${productLine}</div>
          <div class="task-staff-info">${staffLine}</div>
        </div>
        <span class="task-tag ${t.loaiViec==='Gợi ý mua lại'?'buy':''}">${t.loaiViec}</span>
      </div>
      <div class="task-actions">
        <a class="btn-sm btn-call" href="tel:${fmtPhone(t.sdt)}">📞 Gọi ngay</a>
        <button class="btn-sm btn-done" onclick="markDone('${t.id}')">✅ Đã xử lý</button>
      </div>
    </div>`;
  }).join('');
}

async function markDone(id) {
  const card = document.getElementById('task-' + id);
  if (card) card.classList.add('done');
  try {
    const res = await apiCall('markDone', { id });
    if (res.status !== 'ok') throw new Error(res.msg);
    tasks = tasks.filter(t => t.id !== id);
    setTimeout(() => { renderStats(); renderTasks(); }, 400);
  } catch (e) {
    showBanner('err', '❌ Lỗi cập nhật: ' + e.message);
    if (card) card.classList.remove('done');
  }
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = FILTERS.map(f =>
    `<button class="tab-btn ${currentFilter===f.key?'active':''}" onclick="setFilter('${f.key}')">${f.label}</button>`
  ).join('');
}

function setFilter(key) { currentFilter = key; renderTabs(); renderKhach(); }

function renderKhach() {
  const el = document.getElementById('kh-list');
  const query = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase().trim() : '';

  let list = currentFilter === 'all' ? khachHang : khachHang.filter(k => k.phanLoai === currentFilter);

  // Lọc theo từ khóa tìm kiếm (Tên, SĐT, Sản phẩm - kể cả sản phẩm lấy tự động từ Báo Giá)
  if (query) {
    list = list.filter(k => {
      const q = quotesByPhone[phoneKey(k.sdt)];
      const autoProduct = q && q.products && q.products[0] ? String(q.products[0].mo_ta || '') : '';
      return (k.ten && k.ten.toLowerCase().includes(query)) ||
        (k.sdt && String(k.sdt).toLowerCase().includes(query)) ||
        (k.nhuCauChinh && k.nhuCauChinh.toLowerCase().includes(query)) ||
        (autoProduct && autoProduct.toLowerCase().includes(query));
    });
  }

  list = list.slice().sort((a,b) => (b.tongDoanhThu||0) - (a.tongDoanhThu||0));

  if (!list.length) { el.innerHTML = '<div class="empty">Không tìm thấy khách hàng nào</div>'; return; }

  el.innerHTML = list.map(k => `
    <div class="kh-row">
      <div class="kh-info">
        <div class="kh-name">${k.ten || fmtPhone(k.sdt)}</div>
        <div class="kh-sub">📞 ${fmtPhone(k.sdt)} · Mua gần nhất: ${fmtDate(k.ngayMuaGanNhat)}</div>

        <!-- HIỂN THỊ CHI TIẾT SẢN PHẨM, SỐ LƯỢNG, ĐƠN GIÁ (tự khớp từ Báo Giá nếu CRM chưa có) -->
        <div class="kh-product-info">${productInfoLine(k.sdt, k)}</div>

        <!-- NHÂN VIÊN PHỤ TRÁCH -->
        <div class="kh-staff-info">
          👤 Phụ trách: ${k.nhanVien || 'Kinh doanh TDL'}
        </div>

        <div><span class="kh-badge ${BADGE_CLASS[k.phanLoai]||'b-tiemnang'}">${k.phanLoai}</span></div>
      </div>
      <div class="kh-money">
        <div>${fmtCur(k.tongDoanhThu)}</div>
        <div class="lbl">${k.soDon||0} đơn</div>
      </div>
    </div>`).join('');
}

function saveUrl() {
  const v = document.getElementById('api-url-input').value.trim();
  if (!v) return;
  apiUrl = v;
  localStorage.setItem('tdlcrm_api_url', v);
  showBanner('ok', '✅ Đã lưu URL, đang tải lại...');
  loadAll();
}

function saveBaoGiaUrl() {
  const v = document.getElementById('baogia-url-input').value.trim();
  baoGiaApiUrl = v;
  localStorage.setItem('tdlcrm_baogia_api_url', v);
  showBanner('ok', '✅ Đã lưu URL Báo Giá, đang tải lại...');
  loadAll();
}

loadAll();
</script>
</body>
</html>
