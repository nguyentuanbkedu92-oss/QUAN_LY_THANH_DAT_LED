<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tem Bạc Thành Đạt - Fix Lỗi Tràn</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f4f4f4; font-family: "Segoe UI", Arial, sans-serif; padding: 20px; }
        .wrapper { display: flex; gap: 20px; justify-content: center; }

        .form-box { width: 320px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-box h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .form-box input { width: 100%; padding: 8px; margin: 4px 0 10px; border: 1px solid #ddd; border-radius: 5px; }
        .form-box button { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-up { background: #333; color: #fff; }
        .btn-down { background: #e31a1a; color: #fff; font-size: 15px; box-shadow: 0 4px 0 #b31212; }

        #temArea {
            width: 120mm; 
            height: 100mm; 
            background: #fff;
            border: 1px solid #333; 
            border-radius: 0mm;
            padding: 5mm 8mm; /* Giảm nhẹ padding để lấy thêm không gian */
            display: flex; 
            flex-direction: column;
            overflow: hidden; /* Đảm bảo không có gì lòi ra ngoài */
            position: relative;
        }

        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #000; padding-bottom: 1mm; font-size: 15px; font-weight: bold; }
        
        .main-title { text-align: center; margin-top: 2mm; width: 100%; }
        .main-title h1 { font-size: 16pt; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
        .thick-line { width: 100%; height: 1.2mm; background: #000; margin: 2mm 0; }

        .body-content { 
            display: flex; 
            flex-direction: column;
            justify-content: center; /* Căn giữa nội dung thông số */
            flex-grow: 1; 
            margin: 2mm 0;
        }
        
        .info-side { width: 100%; font-size: 12pt; line-height: 1.5; }
        .info-row { display: flex; margin-bottom: 2px; border-bottom: 1px dashed #eee; padding-bottom: 2px; }
        .info-label { font-weight: 700; width: 110px; flex-shrink: 0; }

        /* FOOTER NẰM GỌN TRONG KHUNG */
        .footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 0.5mm solid #333; 
            padding-top: 2mm;
            margin-top: auto; /* Đẩy footer xuống sát đáy */
        }
        .icons { display: flex; gap: 10px; align-items: center; }
        .icons img { height: 25px; width: auto; filter: grayscale(1); opacity: 0.8; }
        
        .origin { text-align: right; }
        .origin b { font-size: 11pt; display: block; }
        .origin p { font-size: 7.5pt; color: #444; font-style: italic; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="form-box">
        <h2>Thông Số Tem</h2>
        <input type="text" id="i1" value="ĐÈN PHA LED MODULE SMD 100W">
        <input type="text" id="i2" value="TDLF-MDS100">
        <input type="text" id="i3" value="100W">
        <input type="text" id="i4" value="Bridgelux / DONE">
        <input type="text" id="i5" value="AC 220V - 50/60Hz">
        <input type="text" id="i6" value="6000K">
        <input type="text" id="i7" value="thanhdatled.com">
        <input type="text" id="i8" value="0986.474.671">

        <button class="btn-up" onclick="update()">CẬP NHẬT TEM</button>
        <button class="btn-down" onclick="download()">XUẤT ẢNH PNG</button>
    </div>

    <div id="temArea">
        <div class="header">
            <span>THÀNH ĐẠT LED - TDL</span>
            <span style="font-weight:normal; font-style:italic">Bừng sáng không gian</span>
        </div>

        <div class="main-title">
            <h1 id="o1">ĐÈN PHA LED MODULE SMD 100W</h1>
            <div class="thick-line"></div>
        </div>

        <div class="body-content">
            <div class="info-side">
                <div class="info-row"><span class="info-label">Mã SP:</span><span id="o2">TDLF-MDS100</span></div>
                <div class="info-row"><span class="info-label">Công suất:</span><span id="o3">100W</span></div>
                <div class="info-row"><span class="info-label">Chip/Nguồn:</span><span id="o4">Bridgelux / DONE</span></div>
                <div class="info-row"><span class="info-label">Điện áp:</span><span id="o5">AC 220V - 50/60Hz</span></div>
                <div class="info-row"><span class="info-label">Ánh sáng:</span><span id="o6">6000K</span></div>
                <div class="info-row"><span class="info-label">Website:</span><span id="o7">thanhdatled.com</span></div>
                <div class="info-row"><span class="info-label">Hotline:</span><span id="o8">0986.474.671</span></div>
            </div>
        </div>

        <div class="footer">
            <div class="icons">
                <img src="https://cdn-icons-png.flaticon.com/128/15960/15960481.png" crossorigin="anonymous">
                <img src="https://cdn-icons-png.flaticon.com/128/9321/9321803.png" crossorigin="anonymous">
                <img src="https://cdn-icons-png.flaticon.com/128/11204/11204755.png" crossorigin="anonymous">
                <img src="https://cdn-icons-png.flaticon.com/128/16170/16170798.png" crossorigin="anonymous">
            </div>
            <div class="origin">
                <b>Sản xuất tại Việt Nam</b>
                <p>Made in Vietnam</p>
            </div>
        </div>
    </div>
</div>

<script>
    function update() {
        for(let i=1; i<=8; i++) {
            document.getElementById('o'+i).innerText = document.getElementById('i'+i).value;
        }
    }

    function download() {
        const target = document.getElementById('temArea');
        html2canvas(target, {
            scale: 4, 
            useCORS: true,
            backgroundColor: "#ffffff"
        }).then(canvas => {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png', 1.0);
            link.download = 'tem-chuan-' + Date.now() + '.png';
            link.click();
        });
    }
</script>

</body>
</html>
