<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDL AI Chatbot – Hybrid Smart Version</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js" integrity="sha512-5gS5SddS052m6B7WOfzN3S90Xlsl8pDshgBSh3z9D0WvG3SEx12Z6K3bOsw631B2W/7gRscv0jXitV76v8Q4uA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
    /* ===== CẤU HÌNH RESET TOÀN KHUNG BAN ĐẦU ===== */
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        font-family: 'Be Vietnam Pro', sans-serif; background: #ffffff;
    }
    #tdl-widget * { box-sizing: border-box; margin: 0; padding: 0; }
    #tdl-widget { position: relative; width: 100%; height: 100%; }

    /* Ẩn nút bong bóng gốc */
    #tdl-bubble-btn, .tdl-tooltip {
        display: none !important;
    }

    /* --- PANEL CHAT TRÀN VIỀN KHÍT KHUNG IFRAME --- */
    #tdl-panel {
        position: absolute; inset: 0 !important; width: 100% !important; height: 100% !important;
        background: #ffffff; display: flex; flex-direction: column; overflow: hidden;
    }

    /* --- HEADER PANEL --- */
    .tdl-header {
        background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 100%);
        padding: 14px 16px; display: flex; align-items: center; gap: 11px; flex-shrink: 0;
    }
    .tdl-header-avatar {
        width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.18);
        border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center;
        justify-content: center; font-size: 13px; font-weight: 800; color: white; position: relative;
    }
    .tdl-header-avatar-dot {
        position: absolute; bottom: 1px; right: 1px; width: 11px; height: 11px;
        background: #4ade80; border-radius: 50%; border: 2px solid #0369a1;
    }
    .tdl-header-info { flex: 1; min-width: 0; }
    .tdl-header-name { font-size: 14px; font-weight: 700; color: white; line-height: 1.2; }
    .tdl-header-sub {
        font-size: 11.5px; color: rgba(255,255,255,0.75); margin-top: 2px;
        display: flex; align-items: center; gap: 5px;
    }
    .tdl-header-sub::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; }
    .tdl-header-actions { display: flex; gap: 6px; }
    .tdl-header-btn {
        width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.15);
        border: none; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center;
        transition: background 0.2s; flex-shrink: 0;
    }
    .tdl-header-btn:hover { background: rgba(255,255,255,0.25); }

    /* Thanh danh mục phía trên */
    .tdl-cats { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #f0f4f8; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
    .tdl-cats::-webkit-scrollbar { display: none; }
    .tdl-cat {
        white-space: nowrap; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px;
        border: 1.5px solid #e2e8f0; background: #f8fafc; color: #64748b; cursor: pointer; transition: all 0.18s;
    }
    .tdl-cat:hover:not(:disabled), .tdl-cat.active { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }

    /* --- KHU VỰC NỘI DUNG CHAT --- */
    #tdl-chat {
        flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column;
        gap: 12px; scroll-behavior: smooth; background: #f8fafc;
    }
    #tdl-chat::-webkit-scrollbar { width: 4px; }
    #tdl-chat::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .tdl-welcome { text-align: center; padding: 15px 8px 5px; }
    .tdl-welcome-icon { width: 52px; height: 52px; background: linear-gradient(135deg, #dbeafe, #bfdbfe); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 12px; }
    .tdl-welcome h3 { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    .tdl-welcome p { font-size: 13px; color: #64748b; line-height: 1.5; }

    /* Tin nhắn */
    .tdl-msg { display: flex; gap: 8px; align-items: flex-end; animation: tdlFadeIn 0.22s ease; }
    .tdl-msg.user { flex-direction: row-reverse; }
    @keyframes tdlFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .tdl-msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .tdl-msg.ai .tdl-msg-avatar { background: linear-gradient(135deg, #0ea5e9, #0369a1); color: white; }
    .tdl-msg.user .tdl-msg-avatar { background: #334155; color: #e2e8f0; }

    .tdl-bubble { max-width: 80%; padding: 10px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.55; word-break: break-word; }
    .tdl-msg.ai .tdl-bubble { background: white; color: #1e293b; border: 1px solid #e8f0fe; border-radius: 4px 16px 16px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .tdl-msg.user .tdl-bubble { background: linear-gradient(135deg, #0ea5e9, #0369a1); color: white; border-radius: 16px 16px 4px 16px; }
    .tdl-msg-time { font-size: 10px; color: #94a3b8; margin-top: 3px; padding: 0 4px; }
    .tdl-msg.user .tdl-msg-time { text-align: right; }

    /* Typing Animation */
    .tdl-typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 2px; }
    .tdl-typing-dots span { width: 5px; height: 5px; background: #94a3b8; border-radius: 50%; animation: tdlBounce 1.2s infinite; }
    .tdl-typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .tdl-typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes tdlBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }

    /* Gợi ý phản hồi nhanh dạng nút */
    .tdl-action-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f4f8; }
    .tdl-action-btn { font-size: 11.5px; padding: 5px 11px; border-radius: 20px; border: 1.5px solid #dbeafe; background: #eff6ff; color: #1d4ed8; cursor: pointer; font-weight: 500; transition: all 0.18s; }
    .tdl-action-btn:hover:not(:disabled) { background: #dbeafe; border-color: #93c5fd; }

    /* Thẻ sản phẩm */
    .tdl-prod-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 12.5px; text-align: left; }
    .tdl-prod-name { font-weight: 700; color: #0f172a; font-size: 13px; margin-bottom: 6px; }
    .tdl-prod-sku { color: #94a3b8; font-size: 11px; margin-bottom: 8px; }
    .tdl-prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .tdl-prod-stat { background: white; border-radius: 8px; padding: 7px 9px; border: 1px solid #f0f4f8; }
    .tdl-prod-stat-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    .tdl-prod-stat-val { font-size: 12.5px; font-weight: 700; color: #0f172a; margin-top: 2px; }
    .tdl-prod-stat-val.price { color: #d97706; font-size: 14px; }
    .tdl-prod-link { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 8px; background: linear-gradient(135deg, #0ea5e9, #0369a1); color: white; text-decoration: none; font-size: 12.5px; font-weight: 700; }

    /* --- CỤM BONG BÓNG GỢI Ý FLOATING QUICK REPLIES (MẮT BÃO STYLE) --- */
    .tdl-floating-quick-replies { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding: 10px 14px; background: #f8fafc; border-top: 1px solid rgba(226, 232, 240, 0.6); flex-shrink: 0; }
    .tdl-floating-btn { display: flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 24px; font-size: 13px; font-weight: 600; color: #1e293b; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); transition: all 0.2s; white-space: nowrap; }
    .tdl-floating-btn:hover:not(:disabled) { background: #eff6ff; border-color: #3b82f6; color: #2563eb; transform: translateY(-1px); }
    .tdl-floating-btn:disabled, .tdl-hint-tag:disabled, .tdl-cat:disabled { opacity: 0.6; cursor: not-allowed; }
    .tdl-floating-arrow { font-size: 11px; color: #94a3b8; }

    /* --- HINT TAGS BAR (THANH TRƯỢT DI ĐỘNG DƯỚI CÙNG) --- */
    .tdl-hints { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; flex-shrink: 0; border-top: 1px solid #f0f4f8; background: white; scrollbar-width: none; }
    .tdl-hints::-webkit-scrollbar { display: none; }
    .tdl-hint-tag { white-space: nowrap; font-size: 11.5px; padding: 4px 11px; border-radius: 20px; border: 1px solid #e2e8f0; background: #f8fafc; color: #64748b; cursor: pointer; transition: all 0.18s; font-weight: 500; }
    .tdl-hint-tag:hover:not(:disabled) { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }

    /* --- KHU VỰC Ô NHẬP LIỆU --- */
    .tdl-input-area { padding: 10px 12px 12px; background: white; border-top: 1px solid #f0f4f8; flex-shrink: 0; }
    .tdl-input-row { display: flex; align-items: center; gap: 8px; background: #f1f5f9; border-radius: 24px; padding: 6px 6px 6px 14px; border: 1.5px solid transparent; }
    .tdl-input-row:focus-within { border-color: #93c5fd; background: white; }
    .tdl-input-row input { flex: 1; background: transparent; border: none; outline: none; font-size: 13.5px; color: #0f172a; font-family: 'Be Vietnam Pro', sans-serif; padding: 4px 0; }
    .tdl-send-btn { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #0ea5e9, #0369a1); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; transition: opacity 0.2s; }
    .tdl-send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .tdl-input-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; padding: 0 4px; }
    .tdl-input-hint { font-size: 10.5px; color: #cbd5e1; }
    .tdl-quote-btn { font-size: 11.5px; font-weight: 600; color: #0369a1; background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

    /* --- MODAL LEAD FORM --- */
    .tdl-modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.7); z-index: 1000000; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .tdl-modal-overlay.open { opacity: 1; pointer-events: all; }
    .tdl-modal { background: white; border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); transform: scale(0.94); transition: transform 0.25s ease; }
    .tdl-modal-overlay.open .tdl-modal { transform: scale(1); }
    .tdl-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .tdl-modal-header h3 { font-size: 16px; font-weight: 700; color: #0f172a; }
    .tdl-modal-close { width: 30px; height: 30px; border-radius: 50%; background: #f1f5f9; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #64748b; }
    .tdl-form-group { margin-bottom: 13px; text-align: left; }
    .tdl-form-group label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px; text-transform: uppercase; }
    .tdl-form-group input, .tdl-form-group textarea { width: 100%; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-family: 'Be Vietnam Pro', sans-serif; color: #0f172a; outline: none; }
    .tdl-form-submit { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, #0ea5e9, #0369a1); color: white; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .tdl-form-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="tdl-widget">
    <div id="tdl-panel">
        <div class="tdl-header">
            <div class="tdl-header-avatar"> TDL <div class="tdl-header-avatar-dot"></div> </div>
            <div class="tdl-header-info">
                <div class="tdl-header-name">TDL AI – Nhân Viên Tư Vấn</div>
                <div class="tdl-header-sub">Trực tuyến 24/7 · Phản hồi ngay</div>
            </div>
            <div class="tdl-header-actions">
                <a href="https://zalo.me/0986474671" target="_blank" class="tdl-header-btn" aria-label="Liên hệ qua Zalo tư vấn kỹ thuật" id="cfgZaloBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 2C6.477 2 2 6.477 2 12c0 5.523 4.477 10 10 10s10-4.477 10-10c0-5.523-4.477-10-10-10zm4.5 13.5h-9v-1.5l5.5-5.5H7.5V7h9v1.5L11 14h5.5v1.5z"/></svg>
                </a>
                <button class="tdl-header-btn" onclick="tdlOpenLeadModal()" aria-label="Mở form đăng ký nhận báo giá">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><path d="M9 12h6M9 16h6M9 8h6M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
                </button>
            </div>
        </div>

        <div class="tdl-cats">
            <button class="tdl-cat active" onclick="tdlHandleCat(this,'tất cả sản phẩm')" aria-label="Xem tất cả danh mục">🏠 Tất cả</button>
            <button class="tdl-cat" onclick="tdlHandleCat(this,'đèn pha')" aria-label="Xem danh mục đèn pha">🔦 Đèn pha</button>
            <button class="tdl-cat" onclick="tdlHandleCat(this,'đèn nhà xưởng')" aria-label="Xem danh mục đèn nhà xưởng">🏭 Nhà xưởng</button>
            <button class="tdl-cat" onclick="tdlHandleCat(this,'pickleball')" aria-label="Xem cấu hình sân pickleball">🏸 Pickleball</button>
            <button class="tdl-cat" onclick="tdlHandleCat(this,'đèn đường')" aria-label="Xem danh mục đèn đường">🛣️ Đèn đường</button>
        </div>

        <div id="tdl-chat">
            <div class="tdl-welcome" id="tdlWelcome">
                <div class="tdl-welcome-icon">💡</div>
                <h3>Xin chào! Tôi là TDL AI - trợ lý tư vấn 24/7</h3>
                <p style="margin-top: 4px;">Em có thể hỗ trợ gì cho dự án chiếu sáng của anh/chị ạ?</p>
            </div>
        </div>

        <div class="tdl-floating-quick-replies" id="tdlFloatingReplies">
            <button class="tdl-floating-btn" onclick="tdlQuickAsk('chiết khấu đại lý')" aria-label="Hỏi về chính sách chiết khấu đại lý">
                <span>🏷️ Chính sách chiết khấu đại lý TDL</span> <span class="tdl-floating-arrow">➔</span>
            </button>
            <button class="tdl-floating-btn" onclick="tdlQuickAsk('linh kiện xuất xứ CO CQ')" aria-label="Hỏi về giấy tờ chứng chỉ CO CQ">
                <span>📜 Giấy tờ xuất xứ linh kiện CO/CQ</span> <span class="tdl-floating-arrow">➔</span>
            </button>
            <button class="tdl-floating-btn" onclick="tdlQuickAsk('pickleball')" aria-label="Hỏi tư vấn cấu hình đèn sân Pickleball">
                <span>🏸 Tư vấn đèn sân Pickleball chống chói</span> <span class="tdl-floating-arrow">➔</span>
            </button>
            <button class="tdl-floating-btn" onclick="tdlQuickAsk('phương thức thanh toán')" aria-label="Hỏi về phương thức thanh toán giao dịch">
                <span>💳 Phương thức thanh toán linh hoạt</span> <span class="tdl-floating-arrow">➔</span>
            </button>
        </div>

        <div class="tdl-hints">
            <button class="tdl-hint-tag" onclick="tdlQuickAsk('chiết khấu đại lý')">🏷️ Chiết khấu ĐL</button>
            <button class="tdl-hint-tag" onclick="tdlQuickAsk('linh kiện xuất xứ CO CQ')">📜 CO/CQ</button>
            <button class="tdl-hint-tag" onclick="tdlQuickAsk('tuổi thọ đèn led')">⏳ Tuổi thọ</button>
            <button class="tdl-hint-tag" onclick="tdlQuickAsk('chính sách bảo hành')">🛡️ Bảo hành</button>
        </div>

        <div class="tdl-input-area">
            <div class="tdl-input-row">
                <input type="text" id="tdlQuestion" placeholder="Hỏi về đèn LED, báo giá, bảo hành..." autocomplete="off" aria-label="Nội dung câu hỏi của bạn">
                <button class="tdl-send-btn" id="tdlSendBtn" onclick="tdlSendMessage()" aria-label="Gửi tin nhắn">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            <div class="tdl-input-footer">
                <span class="tdl-input-hint">Kho Thành Đạt LED – Đồng bộ dữ liệu Hybrid 0ms</span>
                <button class="tdl-quote-btn" onclick="tdlOpenLeadModal()" aria-label="Mở form đăng ký báo giá nhanh">📋 Nhận báo giá</button>
            </div>
        </div>
    </div>
</div>

<div class="tdl-modal-overlay" id="tdlModalOverlay">
    <div class="tdl-modal">
        <div class="tdl-modal-header">
            <h3>📋 Yêu Cầu Báo Giá / Mẫu Đèn</h3>
            <button class="tdl-modal-close" onclick="tdlCloseLeadModal()" aria-label="Đóng form">✕</button>
        </div>
        <form id="tdlLeadForm" onsubmit="tdlSubmitLeadForm(event)">
            <div class="tdl-form-group">
                <label for="tdlFormName">Họ và Tên <span style="color:#f59e0b">*</span></label>
                <input type="text" id="tdlFormName" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>
            <div class="tdl-form-group">
                <label for="tdlFormPhone">Số điện thoại <span style="color:#f59e0b">*</span></label>
                <input type="tel" id="tdlFormPhone" placeholder="Ví dụ: 0986xxxxxx" pattern="[0-9]{9,11}" required>
            </div>
            <div class="tdl-form-group">
                <label for="tdlFormNote">Nhu cầu dự án / Mã đèn quan tâm</label>
                <textarea id="tdlFormNote" rows="3" placeholder="Ví dụ: Cần báo giá đèn pha 200W sân Pickleball..."></textarea>
            </div>
            <button type="submit" class="tdl-form-submit" id="tdlFormSubmitBtn">GỬI YÊU CẦU NGAY</button>
        </form>
    </div>
</div>

<script>
(function() {
    var TDL_API_URL = "https://script.google.com/macros/s/AKfycbyLIkmrpcl4N5L--bZUkeLVQlVuLsr1nURC3klPWhB7liuTkTETJZniqSS5Z_c8WmwX/exec";
    
    var tdlIsLoading = false;
    var tdlLastSubmitTime = 0; 
    var tdlLastMessageTime = 0; 

    // === 1. BỘ DỮ LIỆU CỨNG BACKUP TRỰC TIẾP TRÊN HTML (GIÚP CHẠY LẬP TỨC 0ms) ===
    var tdlDb = {
        faq: [
            [], // Bỏ qua row tiêu đề hệ thống
            ["chiết khấu đại lý", "chính sách sỉ, chiet khau, đại lý", "Dạ bên em chính sách **chiết khấu đại lý từ 30% - 45%** tùy theo giá trị đơn hàng sỉ của dự án chiếu sáng ạ."],
            ["linh kiện xuất xứ CO CQ", "giấy tờ, chung chi, co cq, co/cq", "Dạ toàn bộ sản phẩm của Thành Đạt LED đều sử dụng linh kiện nguồn Driver (Philips, Done, Meanwell) và Chip LED (Bridgelux, Cree) có **đầy đủ chứng chỉ xuất xứ CO/CQ** phục vụ nghiệm thu công trình ạ."],
            ["tuổi thọ đèn led", "tuoi tho, được bao lâu, ben khong", "Dạ đèn sử dụng chip LED linh kiện chính hãng cho tuổi thọ hoạt động đạt **50.000 giờ liên tục**, giúp tiết kiệm tối đa chi phí bảo trì sản xuất ạ."],
            ["chính sách bảo hành", "bao hanh, loi thi sao", "Dạ toàn bộ đèn kho em xuất xưởng được **bảo hành chính hãng đổi mới từ 2 - 5 năm** tùy cấu hình linh kiện yêu cầu ạ."]
        ],
        products: [
            [], // Bỏ qua row tiêu đề hệ thống
            ["TDL-P200", "Đèn pha LED 200W Module Sân Thể Thao", "đèn pha", "200", "Liên hệ nhận giá sỉ", "Bridgelux", "Done/Philips", "2 - 5 năm", "pha 200w, den pha", "https://thanhdatled.com"],
            ["TDL-UFO150", "Đèn LED Nhà Xưởng UFO 150W Cao Cấp", "đèn nhà xưởng", "150", "Liên hệ nhận giá sỉ", "Bridgelux", "Done/Philips", "2 - 3 năm", "highbay, ufo, nha xuong", "https://thanhdatled.com"]
        ],
        config: { hotline: "0986474671", zalo: "https://zalo.me/0986474671" }
    };

    // === 2. ĐỒNG BỘ NGẦM (BACKGROUND SYNC) TỪ GOOGLE SHEET NẾU CÓ MẠNG ===
    function tdlBackgroundSync() {
        fetch(TDL_API_URL)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && data.faq && data.faq.length > 1) {
                    // Nếu Google Sheet hoạt động tốt, cập nhật đè dữ liệu mới nhất vào bộ nhớ
                    tdlDb.faq = data.faq;
                    tdlDb.products = data.products;
                    tdlDb.config = data.config;
                    var zaloBtn = document.getElementById('cfgZaloBtn');
                    if (tdlDb.config && tdlDb.config.zalo && zaloBtn) zaloBtn.href = tdlDb.config.zalo;
                    console.log("TDL DB Live Background Sync thành công!");
                }
            })
            .catch(function(err) {
                // Lỗi Sheets? Không sao cả, bot vẫn chạy bằng bộ dữ liệu cứng ở trên bình thường
                console.warn("TDL Live Sync gián đoạn, đang duy trì chế độ Local Backup:", err);
            });
    }
    // Kích hoạt hàm đồng bộ ngầm sau khi load trang xong
    tdlBackgroundSync();

    function tdlGetTime() {
        return new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }

    function tdlCleanStr(str) {
        if (!str) return "";
        return str.toString().toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ").trim();
    }

    function tdlNormalizeStr(str) {
        if (!str) return "";
        return str.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ").trim();
    }

    // Làm sạch đầu ra bằng bộ lọc DOMPurify tránh hoàn toàn XSS Injection
    function tdlFormatMarkdown(text) {
        if (!text) return "";
        var cleanText = DOMPurify.sanitize(text);
        var html = cleanText.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#0369a1;font-weight:700;">$1</strong>');
        html = html.replace(/\n/g, '<br>');
        return html;
    }

    function tdlSetLoading(state) {
        tdlIsLoading = state;
        var btn = document.getElementById('tdlSendBtn');
        if (btn) btn.disabled = state;
        
        document.querySelectorAll('.tdl-floating-btn, .tdl-hint-tag, .tdl-cat').forEach(function(el) {
            el.disabled = state;
        });
    }

    function tdlAddUserMsg(text) {
        var welcome = document.getElementById('tdlWelcome');
        if (welcome) welcome.remove();
        
        var floatingReplies = document.getElementById('tdlFloatingReplies');
        if (floatingReplies) floatingReplies.remove();

        var chat = document.getElementById('tdl-chat');
        var div = document.createElement('div');
        div.className = 'tdl-msg user';
        div.innerHTML = '<div><div class="tdl-bubble">' + tdlFormatMarkdown(text) + '</div><div class="tdl-msg-time">' + tdlGetTime() + '</div></div><div class="tdl-msg-avatar">U</div>';
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function tdlAddTyping() {
        var chat = document.getElementById('tdl-chat');
        var div = document.createElement('div');
        div.className = 'tdl-msg ai'; div.id = 'tdlTyping';
        div.innerHTML = '<div class="tdl-msg-avatar">AI</div><div class="tdl-bubble"><div class="tdl-typing-dots"><span></span><span></span><span></span></div></div>';
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // Loại bỏ hiệu ứng loading dots
    function tdlRemoveTyping() {
        var el = document.getElementById('tdlTyping');
        if (el) el.remove();
    }

    function tdlRenderProductCard(row) {
        var sku = DOMPurify.sanitize(row[0] || "TDL-LED");
        var name = DOMPurify.sanitize(row[1] || "Sản phẩm Đèn LED");
        var cat = DOMPurify.sanitize(row[2] || "Chiếu sáng");
        var watt = row[3] ? DOMPurify.sanitize(row[3]) + "W" : "---";
        var price = isNaN(row[4]) ? row[4] : Number(row[4]).toLocaleString('vi-VN') + " VNĐ";
        var chip = DOMPurify.sanitize(row[5] || "Chính hãng");
        var warranty = DOMPurify.sanitize(row[7] || "2 - 3 năm");
        var landing = DOMPurify.sanitize(row[9] || "https://thanhdatled.com");

        return '<div class="tdl-prod-card">' +
            '<div class="tdl-prod-name">' + name + '</div>' +
            '<div class="tdl-prod-sku">Mã: ' + sku + ' · ' + cat + '</div>' +
            '<div class="tdl-prod-grid">' +
                '<div class="tdl-prod-stat"><div class="tdl-prod-stat-label">💰 Báo giá đại lý</div><div class="tdl-prod-stat-val price">' + price + '</div></div>' +
                '<div class="tdl-prod-stat"><div class="tdl-prod-stat-label">⚡ Công suất</div><div class="tdl-prod-stat-val">' + watt + '</div></div>' +
                '<div class="tdl-prod-stat"><div class="tdl-prod-stat-label">🔮 Chip LED</div><div class="tdl-prod-stat-val">' + chip + '</div></div>' +
                '<div class="tdl-prod-stat"><div class="tdl-prod-stat-label">🛡️ Bảo hành</div><div class="tdl-prod-stat-val">' + warranty + '</div></div>' +
            '</div>' +
            '<a href="' + landing + '" target="_blank" class="tdl-prod-link">🌐 Xem chi tiết & Đặt mua</a>' +
        '</div>';
    }

    function tdlAddAIMsg(text, matchedProducts, suggestions) {
        matchedProducts = matchedProducts || [];
        suggestions = suggestions || [];
        var chat = document.getElementById('tdl-chat');
        var div = document.createElement('div');
        div.className = 'tdl-msg ai';

        var prodsHtml = "";
        matchedProducts.forEach(function(p) { prodsHtml += tdlRenderProductCard(p); });

        var actionsHtml = "";
        if (suggestions.length > 0) {
            actionsHtml = '<div class="tdl-action-row">' +
                suggestions.map(function(s) {
                    var safeS = DOMPurify.sanitize(s);
                    return '<button class="tdl-action-btn" onclick="tdlQuickAsk(\'' + safeS.replace(/'/g, "\\'") + '\')">' + safeS + '</button>';
                }).join('') +
            '</div>';
        }

        div.innerHTML =
            '<div class="tdl-msg-avatar">AI</div>' +
            '<div style="flex:1;min-width:0">' +
                '<div class="tdl-bubble">' +
                    '<div>' + tdlFormatMarkdown(text) + '</div>' +
                    prodsHtml +
                    actionsHtml +
                '</div>' +
                '<div class="tdl-msg-time">' + tdlGetTime() + ' · TDL AI</div>' +
            '</div>';
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // === HÀM XỬ LÝ LỌC SO KHỚP TỪ KHÓA ĐÁP ỨNG THỜI GIAN 0ms KHÔNG TRỄ ===
    window.tdlSendMessage = function() {
        if (tdlIsLoading) return;
        
        // Cooldown chống Spam liên tục dưới 2 giây
        var now = Date.now();
        if (now - tdlLastMessageTime < 2000) {
            alert("Vui lòng không thao tác quá nhanh!");
            return;
        }
        tdlLastMessageTime = now;

        var input = document.getElementById('tdlQuestion');
        var userText = input.value.trim();
        if (!userText) return;

        input.value = '';
        tdlSetLoading(true);
        tdlAddUserMsg(userText);
        tdlAddTyping();

        // 100ms tạo hiệu ứng chuyển động tự nhiên cho khách hàng
        setTimeout(function() {
            try {
                var textClean = tdlCleanStr(userText);
                var textNorm = tdlNormalizeStr(userText);
                var replyText = "";
                var matchedProds = [];
                var isProdFound = false;

                // A. KIỂM TRA ĐỐI CHIẾU ÉP CỨNG TỪ KHÓA ĐẶC BIỆT CHÍNH XÁC
                if (textNorm.includes("thanh toan") || textNorm.includes("phuong thuc thanh toan")) {
                    replyText = "**Phương thức thanh toán linh hoạt tại Thành Đạt LED:**\n\n" +
                                "• **Với đơn hàng lẻ / giao COD:** Quý khách kiểm tra đèn đúng mẫu mã, số lượng và thanh toán tiền trực tiếp cho shipper.\n\n" +
                                "• **Với đơn hàng dự án / số lượng lớn:** Thanh toán theo tiến độ hợp đồng (Tạm ứng đặt cọc 30-50% để lên đơn sản xuất, phần còn lại thanh toán khi bàn giao đủ hàng hóa hoặc nghiệm thu sân).";
                } 
                else if (textNorm === "pickleball" || textClean === "pickleball" || textClean.includes("san pickleball") || textClean.includes("chong choi")) {
                    replyText = "**Tư vấn Đèn LED chuyên dụng cho Sân Pickleball:**\n\n" +
                                "• Để đảm bảo tiêu chuẩn thi đấu và không gây lóa mắt cho vận động viên, Thành Đạt LED cung cấp dòng **Đèn pha LED module chống chói** (Công suất khuyên dùng: 200W hoặc 300W).\n\n" +
                                "• Đèn tích hợp thấu kính gom sáng góc rộng, triệt tiêu hoàn toàn tia sáng thừa gây lóa khi ngước nhìn bóng. Anh/chị có thể nhấn nút **[Nhận báo giá]** ở chân ô nhập liệu hoặc chát trực tiếp Zalo để nhận hồ sơ kỹ thuật CO CQ sớm nhất ạ!";
                }
                else {
                    // B. QUÉT ĐỐI CHIẾU DỮ LIỆU FAQ THEO CHẾ ĐỘ CHỨA KHỚP KHÔNG DẤU THÔNG MINH
                    var matchedFaq = null;
                    if (tdlDb.faq && tdlDb.faq.length > 1) {
                        for (var j = 1; j < tdlDb.faq.length; j++) {
                            var frow = tdlDb.faq[j];
                            if (!frow || !frow[0]) continue;
                            var keyClean = tdlCleanStr(frow[0]);
                            var keyNorm = tdlNormalizeStr(frow[0]);
                            var synonymsStr = frow[1] || "";
                            
                            if (textClean.includes(keyClean) || keyClean.includes(textClean) || textNorm.includes(keyNorm)) {
                                matchedFaq = frow; break;
                            }
                            var isSyn = synonymsStr.split(",").some(function(s) {
                                var sClean = tdlCleanStr(s);
                                var sNorm = tdlNormalizeStr(s);
                                return sClean.trim() && (textClean.includes(sClean) || sClean.includes(textClean) || textNorm.includes(sNorm));
                            });
                            if (isSyn) { matchedFaq = frow; break; }
                        }
                    }

                    if (matchedFaq) {
                        replyText = matchedFaq[2];
                    } else {
                        // C. ĐỐI CHIẾU SẢN PHẨM TRONG KHO HÀNG HÓA
                        if (tdlDb.products && tdlDb.products.length > 1) {
                            for (var i = 1; i < tdlDb.products.length; i++) {
                                var row = tdlDb.products[i];
                                if (!row || !row[1]) continue;
                                var prodNameClean = tdlCleanStr(row[1]);
                                var prodNameNorm = tdlNormalizeStr(row[1]);
                                var catClean = tdlCleanStr(row[2] || "");
                                var keywordRow = tdlNormalizeStr(row[8] || "");
                                var matchKeyword = keywordRow.split(",").some(function(k) {
                                    return k.trim() && (textNorm === tdlNormalizeStr(k) || textNorm.includes(tdlNormalizeStr(k)));
                                });
                                
                                if ((textClean.includes(prodNameClean) || textNorm.includes(prodNameNorm) || textClean === catClean || matchKeyword) && !textNorm.includes("thanh toan")) {
                                    matchedProds.push(row);
                                    isProdFound = true;
                                }
                            }
                        }

                        if (isProdFound) {
                            replyText = "Dạ, TDL AI đã tìm thấy sản phẩm phù hợp bên dưới ạ:";
                        } else {
                            var hotline = (tdlDb.config && tdlDb.config.hotline) ? tdlDb.config.hotline : "0986474671";
                            replyText = "Dạ, trợ lý chưa tìm thấy từ khóa khớp chính xác trên hệ thống. Anh/chị có thể liên hệ trực tiếp Hotline/Zalo độc quyền: **" + hotline + "** để nhận báo giá sỉ chiết khấu cao nhất ạ!";
                        }
                    }
                }

                var quickSugs = isProdFound || textNorm.includes("thanh toan")
                    ? ["Chính sách bảo hành", "Phương thức vận chuyển", "Nhận báo giá sỉ"]
                    : ["Đèn pha LED 200W", "Đèn nhà xưởng HighBay", "Liên hệ kỹ thuật"];

                tdlRemoveTyping();
                tdlAddAIMsg(replyText, matchedProds, quickSugs);
            } catch(err) {
                console.error("Internal Engine Error:", err);
                tdlRemoveTyping();
                tdlAddAIMsg("Hệ thống dữ liệu đang đồng bộ. Vui lòng gửi lại câu hỏi!", [], []);
            } finally {
                tdlSetLoading(false);
            }
        }, 100); 
    };

    window.tdlQuickAsk = function(text) {
        if (tdlIsLoading) return;
        var inp = document.getElementById('tdlQuestion');
        if (inp) {
            inp.value = text;
            tdlSendMessage();
        }
    };

    window.tdlHandleCat = function(el, queryText) {
        if (tdlIsLoading) return;
        document.querySelectorAll('.tdl-cat').forEach(function(b) { b.classList.remove('active'); });
        el.classList.add('active');
        tdlQuickAsk(queryText);
    };

    // === LEAD FORM MODAL CONTROL ===
    window.tdlOpenLeadModal = function() { document.getElementById('tdlModalOverlay').classList.add('open'); };
    window.tdlCloseLeadModal = function() {
        document.getElementById('tdlModalOverlay').classList.remove('open');
        document.getElementById('tdlLeadForm').reset();
    };

    // Chống Spam Form liên tục phá hoại bằng mốc Cooldown chặn nút gửi 15 giây
    window.tdlSubmitLeadForm = async function(event) {
        event.preventDefault();
        var now = Date.now();
        if (now - tdlLastSubmitTime < 15000) {
            alert("Vui lòng đợi 15 giây trước khi gửi tiếp yêu cầu mới!");
            return;
        }

        var submitBtn = document.getElementById('tdlFormSubmitBtn');
        var name = document.getElementById('tdlFormName').value.trim();
        var phone = document.getElementById('tdlFormPhone').value.trim();
        var note = document.getElementById('tdlFormNote').value.trim();

        submitBtn.disabled = true;
        submitBtn.innerText = "ĐANG GỬI...";

        try {
            await fetch(TDL_API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ name: name, phone: phone, note: note })
            });
            tdlLastSubmitTime = Date.now(); 
            tdlCloseLeadModal();
            alert("Gửi thành công! Thành Đạt LED sẽ liên hệ báo giá cho anh/chị ngay ạ.");
            tdlAddAIMsg("Cảm ơn **" + name + "** đã gửi thông tin! Chúng tôi sẽ gọi lại vào số **" + phone + "** để báo giá chiết khấu dự án.", [], []);
        } catch(e) {
            alert("Gửi thông tin thất bại. Vui lòng thử lại!");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "GỬI YÊU CẦU NGAY";
        }
    };

    function initInputListener() {
        var inp = document.getElementById('tdlQuestion');
        if (inp) {
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) { 
                    e.preventDefault(); 
                    tdlSendMessage(); 
                }
            });
            setTimeout(function() { inp.focus(); }, 300);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initInputListener);
    } else {
        initInputListener();
    }

})();
</script>
