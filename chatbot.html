<iframe id="tdlChatBotFrame" 
        src="https://quanly.thanhdatled.com/chatbot.html" 
        style="display: none;">
</iframe>

<div id="tdlChatBtn" onclick="openTdlChat()">
    <div class="tdl-pulse-ring"></div>
    <div class="tdl-btn-content">
        <span class="tdl-btn-icon">⚡</span>
        <span class="tdl-btn-text">Tư vấn LED sỉ</span>
    </div>
</div>

<style>
/* Cấu hình khung iFrame hiển thị trên Máy tính (PC / Laptop) */
#tdlChatBotFrame {
    position: fixed !important;
    bottom: 90px !important;
    right: 24px !important;
    width: 380px !important;  /* Thu gọn chiều rộng chuẩn góc phải */
    height: 560px !important; /* Chiều cao vừa vặn không che khuất màn hình */
    border: none !important;
    z-index: 999999 !important;
    border-radius: 16px !important;
    box-shadow: 0 12px 40px rgba(0,0,0,0.65) !important;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Giao diện nút bong bóng chat dạng dài sang trọng */
#tdlChatBtn {
    position: fixed !important;
    bottom: 24px !important;
    right: 24px !important;
    height: 50px !important;
    background: linear-gradient(135deg, #00e5ff, #3b82f6) !important;
    border-radius: 30px !important;
    padding: 0 22px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;
    z-index: 999999 !important;
    box-shadow: 0 4px 25px rgba(0, 229, 255, 0.35) !important;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
    user-select: none !important;
}

.tdl-btn-content {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    color: #07090f !important;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
    font-weight: 700 !important;
    font-size: 13.5px !important;
}

.tdl-btn-icon { font-size: 16px !important; }

#tdlChatBtn:hover {
    transform: translateY(-3px) scale(1.03) !important;
    box-shadow: 0 8px 30px rgba(0, 229, 255, 0.5) !important;
}

/* Hiệu ứng sóng neon tỏa ra xung quanh nút kích thích khách tương tác */
.tdl-pulse-ring {
    position: absolute !important;
    inset: 0 !important;
    border: 2px solid #00e5ff !important;
    border-radius: 30px !important;
    animation: tdlRipple 2s cubic-bezier(0.24, 0, 0.38, 1) infinite !important;
    opacity: 0.8 !important;
    pointer-events: none !important;
}

@keyframes tdlRipple {
    0% { transform: scale(0.95); opacity: 0.8; }
    100% { transform: scale(1.2, 1.35); opacity: 0; }
}

/* ⚡ TỰ ĐỘNG ÉP TRÀN 100% KHI VÀO BẰNG ĐIỆN THOẠI (DÙNG CSS MEDIA CHUẨN ĐỘC LẬP) */
@media (max-width: 768px) {
    #tdlChatBotFrame {
        width: 100% !important;
        height: 100% !important;
        bottom: 0 !important;
        right: 0 !important;
        border-radius: 0 !important;
    }
    #tdlChatBtn {
        padding: 0 !important;
        width: 52px !important;
        height: 52px !important;
        border-radius: 50% !important;
    }
    .tdl-btn-text { display: none !important; }
    .tdl-btn-content { justify-content: center !important; }
    .tdl-btn-icon { font-size: 20px !important; }
    .tdl-pulse-ring { border-radius: 50% !important; animation: tdlMobileRipple 2s cubic-bezier(0.24, 0, 0.38, 1) infinite !important; }
}

@keyframes tdlMobileRipple {
    0% { transform: scale(0.95); opacity: 0.8; }
    100% { transform: scale(1.35); opacity: 0; }
}
</style>

<script>
function openTdlChat() {
    var frame = document.getElementById("tdlChatBotFrame");
    var btn = document.getElementById("tdlChatBtn");
    var content = btn.querySelector(".tdl-btn-content");
    var ring = btn.querySelector(".tdl-pulse-ring");
    
    if (frame.style.display === "none" || frame.style.display === "") {
        frame.style.display = "block";
        content.innerHTML = '<span class="tdl-btn-icon">✕</span><span class="tdl-btn-text">Thu gọn</span>';
        btn.style.background = "#1f2937";
        btn.style.boxShadow = "0 4px 15px rgba(0,0,0,0.3)";
        if(ring) ring.style.display = "none";
    } else {
        frame.style.display = "none";
        content.innerHTML = '<span class="tdl-btn-icon">⚡</span><span class="tdl-btn-text">Tư vấn LED sỉ</span>';
        btn.style.background = "linear-gradient(135deg, #00e5ff, #3b82f6)";
        btn.style.boxShadow = "0 4px 20px rgba(0,229,255,0.35)";
        if(ring) ring.style.display = "block";
    }
}
</script>
